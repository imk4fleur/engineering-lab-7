apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab7
spec:
  replicas: 3
  selector:
    matchLabels: {app: lab7}
  template:
    metadata:
      labels: {app: lab7}
    spec:
      containers:
        - name: app
          image: lab7:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: lab7
spec:
  selector: {app: lab7}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab7
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
